<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Catch them</title>
    <link rel="stylesheet" href="../shared/kids.css?v=1" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <main class="game" aria-label="Pokémon catching game">
      <div class="kids-topbar" id="kids-topbar"></div>
      <header class="top">
        <p class="label" id="how-to">
          <span class="how-to-text">Tap a Pokémon to catch it. Tap a name in your list to hear it.</span>
        </p>
        <p class="cheer" id="cheer" aria-live="polite">Catch them!</p>
        <p class="progress" id="progress" aria-live="polite"></p>
      </header>

      <div class="field" id="field" role="group" aria-label="Pokémon to catch"></div>

      <section class="caught" aria-labelledby="caught-heading">
        <div class="caught-head">
          <h2 id="caught-heading">Caught</h2>
          <button class="reset-btn" id="reset-btn" type="button">Start over</button>
        </div>
        <ul class="caught-list" id="caught-list"></ul>
      </section>
    </main>
    <script src="../shared/kids.js?v=1"></script>
    <script src="game.js?v=2"></script>
  </body>
</html>
