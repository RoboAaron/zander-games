<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Shark spotter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game" aria-label="Shark spotting game">
      <header class="top">
        <p class="label">Tap a shark to spot it. Tap a shark in your logbook to open its info card.</p>
        <p class="cheer" id="cheer" aria-live="polite">Go spot some sharks!</p>
        <p class="progress" id="progress" aria-live="polite"></p>
      </header>

      <div class="field" id="field" role="group" aria-label="Sharks to spot"></div>

      <section class="logbook" aria-labelledby="logbook-heading">
        <h2 id="logbook-heading">My shark logbook</h2>
        <ul class="caught-list" id="caught-list"></ul>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
