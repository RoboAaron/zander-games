<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Promise bridge</title>
    <link rel="stylesheet" href="../shared/kids.css?v=3" />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <main class="game" aria-label="Promise bridge">
      <div class="kids-topbar" id="kids-topbar"></div>
      <header class="top">
        <p class="label" id="how-to">
          <span class="how-to-text">Tap the Jesus picture that keeps God&rsquo;s promise.</span>
        </p>
        <p class="cheer" id="cheer" aria-live="polite">God keeps his promise</p>
        <p class="spoken" id="spoken" aria-live="polite"></p>
      </header>

      <section class="prompt" id="prompt" aria-label="God&rsquo;s promise"></section>

      <div class="field" id="field" role="group" aria-label="Which picture keeps the promise"></div>

      <section class="bridge" aria-labelledby="bridge-heading">
        <div class="bridge-head">
          <h2 id="bridge-heading">Your bridge</h2>
          <button class="hear-story" id="hear-story" type="button" hidden>Hear the bridges</button>
          <button class="reset-btn" id="reset-btn" type="button">Start over</button>
        </div>
        <p class="progress" id="progress" aria-live="polite">Matched 0 of 6</p>
        <ul class="matched-list" id="matched-list"></ul>
      </section>
    </main>
    <script src="../shared/kids.js?v=4"></script>
    <script src="game.js?v=1"></script>
  </body>
</html>
